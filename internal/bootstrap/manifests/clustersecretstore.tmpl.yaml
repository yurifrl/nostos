# clustersecretstore.tmpl.yaml — TIER 2 ClusterSecretStore.
#
# Go text/template rendered by the controller. Wires the real 1Password Connect
# provider, matching the existing working ClusterSecretStore the lab already
# trusts (see nostos/templates/dell01.yaml -> cluster-secret-store-onepassword).
# Wait-for-Valid gates the ArgoCD tier.
#
# Provider notes:
#   - connectHost points at the in-cluster 1Password Connect Service.
#   - vaults maps the "kubernetes" vault to priority 1.
#   - auth.secretRef.connectTokenSecretRef references the op-credentials Secret
#     (key "token") in the 1password namespace. That Secret is the irreducible
#     root secret nostos injects into the machineconfig (design risk #3); it is
#     created alongside the 1password namespace, not by this controller.
#
# Template fields (see internal/bootstrap.storeTemplateData):
#   .StoreName       ClusterSecretStore name (renderer-driven)
#   .SecretName      name of the root Secret (currently unused: the 1Password
#                    Connect token Secret is fixed at op-credentials/1password)
#   .SecretNamespace namespace of the root Secret (currently unused, see above)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .StoreName }}
  labels:
    app.kubernetes.io/managed-by: nostos-bootstrap
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.1password.svc.cluster.local:8080
      vaults:
        kubernetes: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: op-credentials
            key: token
            namespace: 1password
