# clustersecretstore.tmpl.yaml — TIER 2 ClusterSecretStore.
#
# Go text/template rendered by the controller. References the root Secret that
# nostos injects into the machineconfig (design risk #3, the one irreducible
# secret). Wait-for-Valid gates the ArgoCD tier.
#
# TODO(design §5): the provider block below is a placeholder. Fill in the real
# provider (e.g. 1Password Connect / onepasswordSDK) wired to the root Secret
# keys once the secret schema is finalized.
#
# Template fields (see internal/bootstrap.storeTemplateData):
#   .StoreName       ClusterSecretStore name
#   .SecretName      name of the root Secret (kube-system)
#   .SecretNamespace namespace of the root Secret
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .StoreName }}
  labels:
    app.kubernetes.io/managed-by: nostos-bootstrap
spec:
  # TODO: real provider config sourced from the root Secret.
  provider:
    fake:
      data:
        - key: nostos-bootstrap-placeholder
          value: "TODO: replace with provider referencing {{ .SecretNamespace }}/{{ .SecretName }}"
